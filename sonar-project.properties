sonar.projectKey=Praise32_DietiEstate25-backend
sonar.organization=praise32

# Definisci dove si trova il codice sorgente reale
sonar.sources=src

# Escludi file che non sono codice di produzione (test, coverage, build, node_modules)
sonar.exclusions=coverage/**/*, dist/**/*, node_modules/**/*, **/*.spec.ts, **/*.test.ts

sonar.coverage.exclusions=src/db/migrations/**/*, src/db/schema/**/*, src/types/**/*, src/index.ts, src/db/index.ts


# Definisci dove sono i test
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts, **/*.test.ts

# Percorso del report di coverage (deve corrispondere a quello generato da Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8