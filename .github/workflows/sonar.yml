name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Importante per una migliore analisi di SonarCloud

      - name: Install dependencies
        run: npm install

      - name: Run Tests and Generate Coverage
        run: npm run test:coverage
        # Questo comando crea la cartella coverage/lcov.info che SonarCloud leggerà

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Token automatico di GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Devi aggiungerlo ai Secrets di GitHub